<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JS Calculator</title>
  <link rel="stylesheet" href="114306009_JS2_HW8.css" />
</head>
<body>
  <div class="container">
    <div class="calculator-card">
      <h1>JS Calculator</h1>

      <div class="form-group">
        <label for="num1">Number 1</label>
        <input id="num1" type="number" step="any" placeholder="123" />
      </div>

      <div class="form-group">
        <label for="num2">Number 2</label>
        <input id="num2" type="number" step="any" placeholder="456" />
      </div>

      <div class="form-group">
        <label for="op">Operate way?</label>
        <select id="op">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">*</option>
          <option value="/">/</option>
        </select>
      </div>

      <button id="calcBtn" type="button">Add</button>

      <div class="result-display">
        Result = <span id="resultText"></span>
      </div>
      <p id="error" class="error"></p>
    </div>
  </div>

  <script src="114306009_JS2_HW8.js"></script>
</body>
</html>
