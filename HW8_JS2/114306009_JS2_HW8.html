<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>114306009_JS2_HW8 - Calculator</title>
  <link rel="stylesheet" href="114306009_JS2_HW8.css" />
</head>
<body>
  <h1>JS2 Calculator</h1>

  <div class="calculator">
    <label>
      Number 1:
      <input id="num1" type="number" step="any" />
    </label>

    <label>
      Operator:
      <select id="op">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
    </label>

    <label>
      Number 2:
      <input id="num2" type="number" step="any" />
    </label>

    <button id="calcBtn" type="button">Calculate</button>

    <p id="error" class="error"></p>
    <div class="result">
      Result: <span id="resultText">-</span>
    </div>
  </div>

  <script src="114306009_JS2_HW8.js"></script>
</body>
</html>
