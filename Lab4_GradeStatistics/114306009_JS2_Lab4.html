<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>114306009_JS2_Lab4 - Grade Statistics</title>
  <link rel="stylesheet" href="114306009_JS2_Lab4.css" />
</head>
<body>
  <h1>Grade Statistics</h1>

  <div class="controls">
    <label>
      Math:
      <input id="mathInput" type="number" min="0" max="100" step="1" />
    </label>

    <label>
      English:
      <input id="englishInput" type="number" min="0" max="100" step="1" />
    </label>

    <button id="submitBtn" type="button">Submit</button>
    <p id="msg" class="msg"></p>
  </div>

  <table id="gradeTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Math</th>
        <th>English</th>
        <th>Row Average</th>
      </tr>
    </thead>

    <tbody id="gradeBody">
      <!-- New rows will be appended here -->
    </tbody>

    <tfoot>
      <tr>
        <th>Avg</th>
        <th id="mathAvg">-</th>
        <th id="englishAvg">-</th>
        <th id="overallAvg">-</th>
      </tr>
    </tfoot>
  </table>

  <script src="114306009_JS2_Lab4.js"></script>
</body>
</html>
